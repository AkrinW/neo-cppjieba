name: macOS and Windows

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}${{ matrix.simd != 'OFF' && format(' / SIMD={0}', matrix.simd) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025-vs2026, windows-11-vs2026-arm]
        build_type: [Debug, Release]
        simd: ["OFF"]
        # MSVC compiles the x86 kernels only here (AVX2 builds include the SSE2 backend); macOS runners are arm64,
        # where NEON builds the scalar fallbacks until NEON kernels exist.
        # windows-11-vs2026-arm holds the only MSVC ARM64 builds, so its NEON level runs in Debug and Release.
        include:
          - {os: windows-2025-vs2026, build_type: Debug, simd: AVX2}
          - {os: windows-2025-vs2026, build_type: Release, simd: AVX2}
          - {os: windows-11-vs2026-arm, build_type: Debug, simd: NEON}
          - {os: windows-11-vs2026-arm, build_type: Release, simd: NEON}
          - {os: macos-26, build_type: Release, simd: NEON}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install LLVM and libc++ on macOS
        if: runner.os == 'macOS'
        run: brew install llvm@23

      - name: Configure macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          llvm_prefix="$(brew --prefix llvm@23)"
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER="$llvm_prefix/bin/clang" \
            -DCMAKE_CXX_COMPILER="$llvm_prefix/bin/clang++" \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$llvm_prefix/lib/c++ -L$llvm_prefix/lib/unwind -lunwind -Wl,-rpath,$llvm_prefix/lib/c++ -Wl,-rpath,$llvm_prefix/lib/unwind" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_TESTING=ON -DCPPJIEBA_BUILD_C_API=OFF -DCPPJIEBA_BUILD_EXAMPLES=ON -DCPPJIEBA_BUILD_BENCHMARKS=ON \
            -DCPPJIEBA_SIMD=${{ matrix.simd }}

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build -G "Visual Studio 18 2026" -A ${{ runner.arch == 'ARM64' && 'ARM64' || 'x64' }}
          -DBUILD_TESTING=ON -DCPPJIEBA_BUILD_C_API=OFF -DCPPJIEBA_BUILD_EXAMPLES=ON -DCPPJIEBA_BUILD_BENCHMARKS=ON
          -DCPPJIEBA_SIMD=${{ matrix.simd }}

      - name: Build library users, tests and benchmarks
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 3

      - name: Run unit tests
        run: >-
          ctest --test-dir build -C ${{ matrix.build_type }}
          --output-on-failure --output-junit unit-tests.xml

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ut-${{ matrix.os }}-${{ matrix.build_type }}-simd-${{ matrix.simd }}
          path: |
            build/unit-tests.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Install public headers and dictionaries
        run: cmake --install build --config ${{ matrix.build_type }} --prefix install
