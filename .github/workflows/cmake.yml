name: CMake

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      update_benchmark_docs:
        description: Measure on the default branch and create a benchmark documentation PR
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # One Debug and one Release job per platform. Debug builds at the platform's highest SIMD level, which also compiles
  # and tests the lower levels; Release keeps the default OFF, whose neo_simd_<level> tests still cover every level
  # the runner executes, and produces the C API package. Linux x64 Debug builds run in the Quality workflow.
  build:
    name: ${{ matrix.platform }} / ${{ matrix.build_type }} / SIMD=${{ matrix.simd }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 also builds the legacy dependency tests.
          - {platform: linux-x64, os: ubuntu-26.04, build_type: Release, simd: "OFF", legacy: "ON"}
          - {platform: linux-arm64, os: ubuntu-26.04-arm, build_type: Debug, simd: NEON, legacy: "OFF"}
          - {platform: linux-arm64, os: ubuntu-26.04-arm, build_type: Release, simd: "OFF", legacy: "OFF"}
          - {platform: macos-arm64, os: macos-26, build_type: Debug, simd: NEON, legacy: "OFF"}
          - {platform: macos-arm64, os: macos-26, build_type: Release, simd: "OFF", legacy: "OFF"}
          - {platform: windows-x64, os: windows-2025-vs2026, build_type: Debug, simd: AVX2, legacy: "OFF"}
          - {platform: windows-x64, os: windows-2025-vs2026, build_type: Release, simd: "OFF", legacy: "OFF"}
          - {platform: windows-arm64, os: windows-11-vs2026-arm, build_type: Debug, simd: NEON, legacy: "OFF"}
          - {platform: windows-arm64, os: windows-11-vs2026-arm, build_type: Release, simd: "OFF", legacy: "OFF"}

    steps:
      - uses: actions/checkout@v7

      # The benchmarks and the legacy tests compare with the original CppJieba.
      - name: Initialize comparison dependencies
        run: git submodule update --init deps/cppjieba deps/limonp

      - name: Install GCC on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc-16 g++-16

      - name: Install LLVM and libc++ on macOS
        if: runner.os == 'macOS'
        run: brew install llvm@23

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=gcc-16 -DCMAKE_CXX_COMPILER=g++-16 -DCMAKE_CXX_STANDARD=23
          -DBUILD_TESTING=ON -DCPPJIEBA_BUILD_LEGACY_TESTS=${{ matrix.legacy }}
          -DCPPJIEBA_BUILD_C_API=ON -DCPPJIEBA_C_API_BUILD_SHARED=ON -DCPPJIEBA_C_API_BUILD_STATIC=ON
          -DCPPJIEBA_BUILD_EXAMPLES=ON -DCPPJIEBA_BUILD_BENCHMARKS=ON -DCPPJIEBA_SIMD=${{ matrix.simd }}

      - name: Configure macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          llvm_prefix="$(brew --prefix llvm@23)"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER="$llvm_prefix/bin/clang" \
            -DCMAKE_CXX_COMPILER="$llvm_prefix/bin/clang++" \
            -DCMAKE_CXX_FLAGS="-stdlib=libc++" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$llvm_prefix/lib/c++ -L$llvm_prefix/lib/unwind -lunwind -Wl,-rpath,$llvm_prefix/lib/c++ -Wl,-rpath,$llvm_prefix/lib/unwind" \
            -DCMAKE_CXX_STANDARD=23 \
            -DBUILD_TESTING=ON -DCPPJIEBA_BUILD_LEGACY_TESTS=${{ matrix.legacy }} \
            -DCPPJIEBA_BUILD_C_API=ON -DCPPJIEBA_C_API_BUILD_SHARED=ON -DCPPJIEBA_C_API_BUILD_STATIC=ON \
            -DCPPJIEBA_BUILD_EXAMPLES=ON -DCPPJIEBA_BUILD_BENCHMARKS=ON -DCPPJIEBA_SIMD=${{ matrix.simd }}

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build -G "Visual Studio 18 2026" -A ${{ runner.arch == 'ARM64' && 'ARM64' || 'x64' }}
          -DCMAKE_CXX_STANDARD=23
          -DBUILD_TESTING=ON -DCPPJIEBA_BUILD_LEGACY_TESTS=${{ matrix.legacy }}
          -DCPPJIEBA_BUILD_C_API=ON -DCPPJIEBA_C_API_BUILD_SHARED=ON -DCPPJIEBA_C_API_BUILD_STATIC=ON
          -DCPPJIEBA_BUILD_EXAMPLES=ON -DCPPJIEBA_BUILD_BENCHMARKS=ON -DCPPJIEBA_SIMD=${{ matrix.simd }}

      - name: Build the library users, tests, examples and benchmarks
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 4

      - name: Test units, C ABI contracts, C hosts, symbols and installed consumers
        run: >-
          ctest --test-dir build -C ${{ matrix.build_type }}
          --no-tests=error --output-on-failure --output-junit unit-tests.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ut-${{ matrix.platform }}-${{ matrix.build_type }}-simd-${{ matrix.simd }}
          path: |
            build/unit-tests.xml
            build/Testing/Temporary/LastTest.log
            build/c-api-consumer-*/**/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Install public headers and dictionaries
        run: cmake --install build --config ${{ matrix.build_type }} --prefix install

      # Packages come only from OFF builds, which run on any CPU of the platform.
      - name: Install C API libraries, headers and package metadata
        if: matrix.simd == 'OFF'
        run: cmake --install build/api --config ${{ matrix.build_type }} --prefix c-api-install

      - name: Archive C API package
        if: matrix.simd == 'OFF'
        # Preserve versioned shared-library symlinks in the uploaded package.
        run: >-
          cmake -E tar czf c-api-${{ matrix.platform }}-${{ matrix.build_type }}.tar.gz
          --format=gnutar c-api-install

      - name: Upload C API package
        if: matrix.simd == 'OFF'
        uses: actions/upload-artifact@v7
        with:
          name: c-api-${{ matrix.platform }}-${{ matrix.build_type }}
          path: c-api-${{ matrix.platform }}-${{ matrix.build_type }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  # Released symbols and public types must stay binary compatible; additions are reported only.
  abi:
    name: C ABI compatibility with the latest release
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          # The baseline is the latest v* tag reachable from the checkout.
          fetch-depth: 0

      - name: Install GCC and libabigail
        run: sudo apt-get update && sudo apt-get install -y gcc-16 g++-16 abigail-tools

      - name: Compare with the latest release
        env:
          CC: gcc-16
          CXX: g++-16
        run: tools/check-c-abi.sh build-abi

      - name: Publish the ABI report
        if: always()
        run: |
          if [ -f build-abi/summary.md ]; then
            cat build-abi/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  benchmarks:
    name: Release benchmarks
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CXX: g++-16
      RUSTUP_TOOLCHAIN: "1.99.0"
      UPDATE_BENCHMARK_DOCS: ${{ github.event_name == 'workflow_dispatch' && inputs.update_benchmark_docs && github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
      - name: Initialize comparison dependency
        run: git submodule update --init deps/cppjieba deps/limonp
      - name: Initialize pinned Rust and Python jieba
        run: git submodule update --init deps/jieba-rs deps/python-jieba
      - name: Install C++23 compiler
        run: sudo apt-get update && sudo apt-get install -y g++-16
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"
      - name: Install pinned Rust compiler
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - name: Configure standalone benchmarks
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF -DCPPJIEBA_BUILD_BENCHMARKS=ON
          -DCPPJIEBA_BUILD_RUST_BENCHMARKS=ON
      - name: Check benchmark isolation
        run: |
          test ! -d build/test
          test ! -d build/_deps/googletest-src
      - name: Build
        run: cmake --build build --parallel 2
      - name: Record benchmark environment
        run: |
          mkdir -p benchmark/results/ci
          {
            git rev-parse HEAD
            git submodule status
            "$CXX" --version
            rustc --version --verbose
            cargo --version
            python --version
            cmake --version
            uname -a
            lscpu
          } > benchmark/results/ci/environment.txt
      - name: Record snapshot provenance
        if: env.UPDATE_BENCHMARK_DOCS == 'true'
        env:
          BENCHMARK_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          BENCHMARK_RUNNER_IMAGE: ubuntu-26.04
        run: >-
          python docs/benchmarks/snapshot.py record-environment
          --build-directory build --output benchmark/results/ci/environment.json
      - name: Rust adapter unit tests
        run: >-
          cargo test --release --locked --manifest-path deps/rust-jieba/Cargo.toml
          --target-dir build/deps/rust-jieba/cargo
      - name: Python adapter unit tests
        run: python -B -m unittest discover -s benchmark -p 'python_compare_benchmark_test.py' -v
      - name: Benchmark snapshot unit tests
        run: python -B -m unittest discover -s docs/benchmarks -p '*_test.py' -v
      - name: Rust comparison smoke check
        working-directory: ${{runner.temp}}
        run: >-
          ${{github.workspace}}/build/benchmark/cut_compare_benchmark
          ${{github.workspace}}/dict/jieba.dict.utf8 ${{github.workspace}}/dict/hmm_model.utf8
          '' ${{github.workspace}}/test/testdata/testlines.utf8 1 1

      - name: Compare old C++, neo C++, Rust and Python
        run: |
          benchmark_cpu="$(python -c 'import os; print(min(os.sched_getaffinity(0)))')"
          printf 'benchmark_cpu=%s\n' "$benchmark_cpu" >> benchmark/results/ci/environment.txt
          for corpus in testlines weicheng; do
            if [ "$corpus" = testlines ]; then
              rounds=10000
            else
              rounds=3
            fi
            taskset -c "$benchmark_cpu" python -B benchmark/python_compare_benchmark.py \
              build/benchmark/cut_compare_benchmark \
              --text "test/testdata/$corpus.utf8" --rounds "$rounds" --samples 5 \
              --output "benchmark/results/ci/$corpus.json" \
              2>&1 | tee "benchmark/results/ci/$corpus.log"
          done

      - name: Generate benchmark documentation
        if: env.UPDATE_BENCHMARK_DOCS == 'true'
        run: |
          python -m pip install matplotlib==3.11.2
          python docs/benchmarks/snapshot.py generate \
            --reports benchmark/results/ci --snapshot docs/benchmarks/snapshot.json --readme README.md
          python docs/benchmarks/plot.py docs/benchmarks/snapshot.json docs/benchmarks/comparison.svg
          git diff --check

      - name: Upload generated benchmark documentation
        if: env.UPDATE_BENCHMARK_DOCS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-documentation
          path: |
            README.md
            docs/benchmarks/snapshot.json
            docs/benchmarks/comparison.svg
          if-no-files-found: error
          retention-days: 14

      - name: Publish comparison summary
        if: always()
        env:
          BENCHMARK_STATUS: ${{ job.status }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p benchmark/results/ci
          cpu_model="$(awk -F': *' '/^model name/ { print $2; exit }' /proc/cpuinfo)"
          {
            printf '## Old C++ / Neo C++ / Rust / Python\n\n'
            printf 'Benchmark job: **%s**. [Workflow and reports](%s).\n\n' "$BENCHMARK_STATUS" "$RUN_URL"
            printf 'Head: `%s`; tested commit: `%s`.\n\n' "$PR_HEAD_SHA" "$TESTED_SHA"
            printf 'Runner CPU: `%s`.\n\n' "${cpu_model:-unknown}"
            printf 'Release, one CPU, five samples; timings are observations without a performance gate.\n\n'
            printf 'These results compare implementations, not this PR against its base branch.\n\n'
            for corpus in testlines weicheng; do
              printf '### %s\n\n' "$corpus"
              if [ -f "benchmark/results/ci/$corpus.md" ]; then
                cat "benchmark/results/ci/$corpus.md"
                printf '\n'
              else
                printf 'No completed benchmark report was produced; see the workflow log.\n\n'
              fi
            done
          } > benchmark/results/ci/summary.md
          cat benchmark/results/ci/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-linux-x64-release
          path: benchmark/results/ci/
          if-no-files-found: ignore
          retention-days: 14

  benchmark-comment:
    name: Benchmark PR comment
    needs: benchmarks
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Check that this is still the current PR head
        id: current
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pull } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            });
            return pull.state === 'open' && pull.head.sha === context.payload.pull_request.head.sha;

      - name: Download comparison reports
        if: steps.current.outputs.result == 'true'
        uses: actions/download-artifact@v8
        with:
          name: benchmarks-linux-x64-release
          path: benchmark-report

      - name: Update benchmark comment
        if: steps.current.outputs.result == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: jieba-benchmark
          path: benchmark-report/summary.md

  benchmark-docs:
    name: Benchmark documentation PR
    needs: [build, benchmarks, isolation]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.update_benchmark_docs &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check that the measured revision is still current
        env:
          MEASURED_REVISION: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$MEASURED_REVISION" ]; then
            echo 'The default branch advanced during measurement; run the workflow again on its latest commit.' >&2
            exit 1
          fi
      - name: Download generated documentation
        uses: actions/download-artifact@v8
        with:
          name: benchmark-documentation
          path: .
      - name: Create or update the documentation PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: docs/benchmark-results
          base: ${{ github.event.repository.default_branch }}
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "docs: refresh benchmark results from GitHub Actions"
          title: "docs: refresh benchmark results from GitHub Actions"
          body: |
            Update the README benchmark section, numeric snapshot and chart from the same CI measurement.

            Measured commit: `${{ github.sha }}`.
            [Workflow, environment and raw reports](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            All four implementations ran serially on one CPU with five samples per case.
            The snapshot includes timing ranges, input hashes and token-sequence difference counts.
          add-paths: |
            README.md
            docs/benchmarks/snapshot.json
            docs/benchmarks/comparison.svg

  # Each optional component stays out of builds that do not request it.
  isolation:
    name: Build option isolation
    runs-on: ubuntu-26.04
    env:
      CXX: g++-16
    steps:
      - uses: actions/checkout@v7
      - name: Initialize comparison dependencies
        run: git submodule update --init deps/cppjieba deps/limonp
      - name: Install C++23 compiler
        run: sudo apt-get update && sudo apt-get install -y g++-16
      - name: Configure only the public library
        run: cmake -S . -B build -DBUILD_TESTING=OFF -DCPPJIEBA_BUILD_BENCHMARKS=OFF
      - name: Install public headers and data
        run: cmake --install build --prefix install
      - name: Check installation and dependency isolation
        run: |
          test -f install/include/neo/Jieba.hpp
          test -f install/share/neo_cppjieba/dict/jieba.dict.utf8
          test ! -e install/share/cppjieba
          test ! -e install/include/cppjieba
          test ! -e install/include/limonp
          test ! -d build/deps
          test ! -d build/_deps
      - name: Check that unit tests configure without benchmarks or comparison dependencies
        run: |
          cmake -S . -B build-tests -DBUILD_TESTING=ON -DCPPJIEBA_BUILD_LEGACY_TESTS=OFF -DCPPJIEBA_BUILD_BENCHMARKS=OFF
          test ! -d build-tests/benchmark
          test ! -d build-tests/deps
      - name: Build the benchmarks without tests or Rust
        run: |
          cmake -S . -B build-benchmarks -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCPPJIEBA_BUILD_BENCHMARKS=ON -DCPPJIEBA_BUILD_RUST_BENCHMARKS=OFF
          test ! -d build-benchmarks/test
          test ! -d build-benchmarks/_deps/googletest-src
          cmake --build build-benchmarks --parallel 4
